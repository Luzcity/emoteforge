name: Claude Code

# Issue / PR コメント・レビューに @claude を含むと起動し、依頼に応答する。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 同一 issue/PR への連続メンションで重複応答しないよう、古い実行はキャンセルする。
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # @claude メンションを含み、かつ信頼できる権限者(OWNER/MEMBER/COLLABORATOR)が
    # 発火させた場合だけ起動する。外部ユーザーが privileged な自動化・課金枠を
    # 起動できないよう author_association でゲートする。
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CLAUDE.md は claude-code-action が自動で読む。レビュー依頼時に観点を確実に
          # 適用させるため append-system-prompt で明示的にナッジする（モデルも固定）。
          claude_args: >-
            --model claude-opus-4-8
            --append-system-prompt "レビュー依頼時はCLAUDE.mdのレビュー観点を全項目体系的に適用し、推測ではなくコードを根拠に、確信度の高い指摘へ重大度(Critical/High/Medium/Low)を付けて日本語で報告すること。該当なしの観点は省略。"
