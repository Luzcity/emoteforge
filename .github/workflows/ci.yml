name: CI

# GITHUB_TOKEN は最小権限（読み取りのみ）。昇格が要るジョブだけ個別に拡張する。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチの古い実行はキャンセルして無駄な並列を抑える。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned)
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: rustfmt
        run: cargo fmt --all --check
      # --locked: Cargo.lock の更新漏れを CI で検出し、暗黙の依存ドリフトを防ぐ。
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: check
        run: cargo check --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked

  tauri-check:
    name: Tauri shell (fmt/clippy/check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned)
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
      # フォーマットはコンパイル不要なので依存導入前に確認する。
      - name: rustfmt (src-tauri)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # Tauri v2 の Linux ビルド依存。src-tauri はワークスペース除外のため個別に check する。
      - name: install tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      # generate_context! が frontendDist(../dist) を要求するため先にビルドしておく。
      - run: npm ci
      - run: npm run build
      # dump_index.json は生成物で未コミット。tauri.conf.json が宣言するリソースのため
      # 存在しないと tauri-build が失敗する。CI のコンパイル確認用に空スタブを置く
      # (実行時 with_dump_index は不在を許容するが、ビルド時はファイル存在が必要)。
      - name: stub generated resource
        run: '[ -f catalog/dump_index.json ] || echo "{}" > catalog/dump_index.json'
      # clippy が型チェックも兼ねるので check は別途実行しない。
      - name: clippy (src-tauri)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: prettier
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  lua:
    name: Lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false
      - name: install lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: luac -p (構文チェック)
        run: |
          set -euo pipefail
          # NUL 区切りで列挙し、空白入りパス/0件でも安全に回す。
          status=0
          while IFS= read -r -d '' f; do
            echo "checking $f"
            luac5.4 -p "$f" || status=1
          done < <(git ls-files -z '*.lua')
          exit $status

  bridge-drift:
    name: Bridge drift (black-box)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned)
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: install lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      # 同梱ブリッジをテンプレートから再生成し、コミット済みと差分が無いことを確認する。
      # generator を黒箱として扱い、出力が手で同期されているかを検証する。
      - name: regenerate bundled bridge
        run: cargo run --quiet --locked -p emoteforge_core --example sync_bridge
      - name: assert no drift
        run: git diff --exit-code -- fivem/emoteforge_bridge
      - name: luac -p on regenerated output
        run: |
          set -euo pipefail
          shopt -s nullglob # 0件マッチ時にリテラルが渡るのを防ぐ
          for f in fivem/emoteforge_bridge/*.lua; do luac5.4 -p "$f"; done
