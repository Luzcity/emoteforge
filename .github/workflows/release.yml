name: Release

# vX.Y.Z タグの push で Tauri アプリをビルドし、GitHub Release に
# Windows インストーラ(nsis/msi)を添付する。手動検証用に dispatch も許可する。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Release 作成にはリポジトリへの書き込みが要る(CI 既定の read のみでは不可)。
permissions:
  contents: write

jobs:
  release:
    name: Build & release (Windows)
    # bundle ターゲットは nsis/msi(Windows 専用)。src-tauri はワークスペース除外で
    # Win11 ビルド前提のため、Windows ランナーのみで実行する。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned)

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # flake.nix(Node 22)と揃え、依存解決のブレを抑える。
          node-version: 22
          cache: npm

      # tauri-action はフロント依存を入れないので明示的に install する。
      - run: npm ci

      # tauri.conf.json は version をハードコードしている(0.1.0)。
      # タグから採ったバージョンを書き込み、インストーラの版とタグを一致させる。
      # dispatch 実行時(タグ無し)はファイルの値をそのまま使う。
      - name: sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # タグ名は ${{ }} で直接展開せず env 経由で渡す。
        # 直接補間すると細工したタグ名でスクリプトインジェクションが成立するため。
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json
          Write-Host "tauri.conf.json version -> $version"

      # tauri.conf.json が宣言する dump_index.json は生成物(未コミット)。
      # リリースに空スタブを同梱すると実行時に存在検証が authoritative な空マップで
      # 全滅するため、上流 dump から実データを生成する。dump は再現性のためコミット
      # SHA に固定。生成器は catalog.json も上書きするので、テスト済みの版を保つため
      # 生成後に git checkout で戻し、新鮮な dump_index.json だけを同梱する。
      - name: generate dump index
        shell: bash
        # dump 取得元は単一ソース化のため env で定義し、curl と build_catalog.mjs で共有する。
        # 再現性のためコミット SHA に固定。
        env:
          DUMP_URL: "https://raw.githubusercontent.com/DurtyFree/gta-v-data-dumps/26292ec7cb4c8cb8525cfede86ab5685328b916b/animDictsCompact.json"
        run: |
          set -euo pipefail
          # 瞬断や一時障害でリリースが落ちないよう retry/timeout を付ける。
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$DUMP_URL" \
            -o catalog/animDictsCompact.json
          node catalog/build_catalog.mjs
          git checkout -- catalog/catalog.json
          # 埋め込む dump_index が空/{} だと存在検証が無言で curated-only に劣化する。
          # また committed catalog.json と固定 SHA dump がズレると、dump に無い curated 組が
          # 実行時に検証拒否される。どちらもリリース前にここで弾く。
          node -e '
            const fs = require("fs");
            const cat = JSON.parse(fs.readFileSync("catalog/catalog.json", "utf8"));
            const idx = JSON.parse(fs.readFileSync("catalog/dump_index.json", "utf8"));
            const dicts = Object.keys(idx).length;
            if (dicts < 100) {
              console.error(`dump_index degraded: only ${dicts} dicts`);
              process.exit(1);
            }
            const missing = cat.entries.filter(e => !(idx[e.dict] && idx[e.dict].includes(e.clip)));
            if (missing.length) {
              console.error(`${missing.length} curated entries absent from dump_index (catalog/pin mismatch), e.g.:`);
              console.error(missing.slice(0, 5).map(e => `  ${e.dict}/${e.clip}`).join("\n"));
              process.exit(1);
            }
            console.log(`dump_index OK: ${dicts} dicts, all ${cat.entries.length} curated entries present`);
          '

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # タグ push 時はそのタグ名で、dispatch 時は app の version からタグを作る。
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}
          releaseName: "EmoteForge ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}"
          # 中身を確認してから手動で publish できるよう draft で作成する。
          releaseDraft: true
          prerelease: false

      # インストーラに加え、全リソース埋め込み済みのポータブル exe を Release に添付する。
      # catalog.json / dump_index.json / emote.schema.json はバイナリに include_bytes! で内包されており、
      # この exe 単体で起動できる。
      - name: upload portable exe
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tauri v2 は productName(EmoteForge) で binary をリネームし得るため大小文字を問わず探す。
          # build/・deps/ 配下のキャッシュ同名物を除外し、ちょうど 1 件でなければ明示的に失敗する
          # （複数一致時に誤った exe を黙って添付するのを防ぐ）。
          mapfile -t exes < <(find src-tauri/target -type f \
            -not -path '*/release/build/*' -not -path '*/release/deps/*' \
            -path '*/release/*' -iname 'emoteforge.exe')
          if [ "${#exes[@]}" -ne 1 ]; then
            echo "expected exactly 1 emoteforge.exe, found ${#exes[@]}:"
            printf ' - %s\n' "${exes[@]}"
            ls -R src-tauri/target || true
            exit 1
          fi
          exe="${exes[0]}"
          # ポータブル exe は emotecreator.exe という名前で配布する。
          # gh の `file#label` 構文は表示ラベルのみでダウンロード時のファイル名を変えないため、
          # 実ファイル名を変えてから upload する。
          cp "$exe" emotecreator.exe
          gh release upload "$TAG_NAME" emotecreator.exe --clobber
